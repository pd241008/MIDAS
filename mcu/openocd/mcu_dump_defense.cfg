# Dump defense-pipeline per-stage DWT cycle arrays (firmware-filled SRAM).
# g_bench_done = 0x200001e0 (polled), g_route = 0x200001e4 (50 B),
# g_stage_cyc[5][50] = 0x20000218 (1000 B).
source [find interface/stlink.cfg]
source [find target/stm32f4x.cfg]

proc poll_done {} {
    set done [expr "0x[lindex [mdw 0x200001e0] 1]"]
    while {$done == 0} {
        sleep 20
        halt
        set done [expr "0x[lindex [mdw 0x200001e0] 1]"]
        if {$done} { break }
        resume
    }
    puts "benchmark done flag set"
    dump_image /tmp/opencode/stage_cyc.bin 0x20000218 0x3E8
    dump_image /tmp/opencode/route.bin    0x200001e4 0x32
    puts "dump written"
    shutdown
}

$_TARGETNAME configure -event halted poll_done
init
reset halt
resume